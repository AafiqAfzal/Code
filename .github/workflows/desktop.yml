name: Desktop app (Windows installer)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Read version
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Ensure release tag exists
        shell: bash
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi
      # Sestaví instalátor (NSIS), podepíše aktualizační balíček a zveřejní vydání
      # včetně latest.json pro automatické aktualizace.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ steps.v.outputs.version }}
          releaseName: Pedagogický deník ${{ steps.v.outputs.version }}
          releaseBody: |
            **Instalace (Windows):** stáhněte `Pedagogicky-denik_${{ steps.v.outputs.version }}_x64-setup.exe` a spusťte. Nepotřebuje práva správce, vytvoří ikonu na ploše.

            Nainstalovaná aplikace se na další verze aktualizuje sama (Nastavení → Aktualizace aplikace).

            Windows může zobrazit varování SmartScreen (aplikace není podepsaná certifikátem) – klikněte na „Další informace“ → „Přesto spustit“.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target x86_64-pc-windows-msvc
